<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Me vs Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --display:'Big Shoulders Display','Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  --bg:#e9ecfb; --glow:rgba(255,190,60,.38);
  --surface:#ffffff; --surface-2:#f1f2fe; --line:rgba(21,18,58,.12);
  --ink:#15123a; --ink-2:#54508a;
  --gold:#ffc857; --gold-ink:#2b1d00; --gold-text:#8a5a00; --gold-line:rgba(224,150,0,.55);
  --win:#0a8460; --loss:#c42d48; --slate:#6a71a3;
  --me1:#ffcf5c; --me2:#f7a400; --me3:#d97400;
  --focus:#4a5bff;
  --shadow:0 1px 0 rgba(21,18,58,.05),0 18px 34px -22px rgba(21,18,58,.45);
  /* scoreboard hardware stays dark in both themes */
  --tile-top:#2e2a6b; --tile-bot:#1f1c4d; --tile-ink:#ffffff;
  --gold-b:#ffd77a; --win-b:#4ff0b7; --loss-b:#ff8494;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f0d26; --glow:rgba(255,200,87,.16);
    --surface:#1a1741; --surface-2:#242058; --line:rgba(255,255,255,.1);
    --ink:#f4f1ff; --ink-2:#b5b0dc;
    --gold-text:#ffd36b; --gold-line:rgba(255,200,87,.5);
    --win:#4ff0b7; --loss:#ff8494; --slate:#8b93c4;
    --me1:#fff2b8; --me2:#ffc857; --me3:#e79a00;
    --focus:#ffc857;
    --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 22px 40px -26px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f0d26; --glow:rgba(255,200,87,.16);
  --surface:#1a1741; --surface-2:#242058; --line:rgba(255,255,255,.1);
  --ink:#f4f1ff; --ink-2:#b5b0dc;
  --gold-text:#ffd36b; --gold-line:rgba(255,200,87,.5);
  --win:#4ff0b7; --loss:#ff8494; --slate:#8b93c4;
  --me1:#fff2b8; --me2:#ffc857; --me3:#e79a00;
  --focus:#ffc857;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 22px 40px -26px rgba(0,0,0,.8);
}

/* ============ BASE ============ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;font-family:var(--body);color:var(--ink);line-height:1.45;
  background-color:var(--bg);
  background-image:radial-gradient(1000px 440px at 50% -140px,var(--glow),transparent 70%);
  background-repeat:no-repeat;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;
  overflow-x:clip;-webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
input,label{touch-action:manipulation}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;margin:0 0 4px;letter-spacing:.01em}

/* ============ TILES (split-flap scoreboard) ============ */
.tiles{display:inline-flex;align-items:flex-end;gap:.07em;font-family:var(--display);font-weight:800;font-size:var(--ts,2.4rem);line-height:1;perspective:500px;vertical-align:bottom}
.t{position:relative;display:inline-grid;place-items:center;width:.66em;height:1.1em;border-radius:.09em;color:var(--tile-ink);
  background:linear-gradient(var(--tile-top) 0 50%,var(--tile-bot) 50% 100%);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.35),0 .07em .12em rgba(0,0,0,.3)}
.t::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:rgba(0,0,0,.6)}
.c{align-self:center;width:.26em;text-align:center;color:var(--ink);opacity:.8;font-weight:900;margin-top:-.08em}
.u{align-self:flex-end;font-family:var(--body);font-size:.36em;font-weight:800;color:var(--ink-2);margin:0 .28em .32em .22em}
.tiles.gold .t{color:var(--gold-b)}
.tiles.hot .t{color:var(--gold-b);text-shadow:0 0 .35em rgba(255,200,80,.65)}
.tiles.win .t{color:var(--win-b)}
.tiles.loss .t{color:var(--loss-b)}
.tiles.neutral .t{color:#fff}
.tiles.dim .t{color:rgba(255,255,255,.28)}
.flip{animation:flipIn .6s calc(var(--i,0)*80ms + 80ms) cubic-bezier(.2,.9,.25,1) both}
@keyframes flipIn{from{transform:rotateX(-92deg);opacity:0}60%{opacity:1}to{transform:none;opacity:1}}

/* ============ HERO ============ */
.hero{display:flex;flex-direction:column;gap:14px;padding:4px 0 26px}
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.today{font-weight:700;color:var(--ink-2)}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.icon-btn[aria-pressed="false"]{color:var(--ink-2)}
.vs{margin:0;display:flex;align-items:baseline;gap:.1em;font-family:var(--display);font-weight:900;line-height:.8;font-size:clamp(5.2rem,26vw,11rem);letter-spacing:-.005em}
.vs .me{background:linear-gradient(180deg,var(--me1) 0%,var(--me2) 48%,var(--me3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.02em}
.vs .v{font-size:.26em;font-weight:800;color:var(--ink-2);font-style:italic;transform:translateY(-.55em)}
.vs .ghost{background:none;-webkit-text-stroke:2.5px var(--ink-2);color:transparent;opacity:.6;animation:ghostIn .9s .15s cubic-bezier(.2,.9,.25,1) both}
@keyframes ghostIn{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:.6}}
.hero-row{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between}
.score{--ts:clamp(2.6rem,10vw,3.5rem);display:flex;align-items:center;gap:12px}
.score .who{font-weight:800;font-size:1rem}
.score .sep{font-family:var(--display);font-weight:900;font-size:2.2rem;color:var(--ink-2)}
.hero-sub{margin:0;color:var(--ink-2);font-weight:500}
.portal{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.portal i{width:8px;height:8px;border-radius:50%;background:var(--win);box-shadow:0 0 0 0 var(--win);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,240,183,.6)}70%{box-shadow:0 0 0 8px rgba(79,240,183,0)}100%{box-shadow:0 0 0 0 rgba(79,240,183,0)}}

/* ============ BOUT CARDS ============ */
.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin:8px 0 14px}
.section-head p{margin:0;color:var(--ink-2);font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.bout{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 18px 16px 22px;box-shadow:var(--shadow);overflow:hidden}
.bout::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--line)}
.bout[data-state="record"]{border-color:var(--gold-line)}
.bout[data-state="record"]::before{background:linear-gradient(#ffe89a,#ffb000)}
.bout[data-state="win"]::before,.bout[data-state="tie"]::before{background:var(--win)}
.bout[data-state="loss"]::before{background:var(--loss)}
.bout.fresh[data-state="record"]::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,226,140,.38) 50%,transparent 62%);transform:translateX(-110%);animation:sheen 1.8s .9s 1 forwards}
@keyframes sheen{to{transform:translateX(110%)}}
.bout-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bout-h h3{margin:0;font-family:var(--display);font-weight:800;font-size:1.65rem;line-height:1.05;letter-spacing:.01em}
.kind{display:block;font-size:.8rem;color:var(--ink-2);font-weight:600;margin-top:2px}
.streak{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:.85rem;color:var(--gold-text);background:var(--surface-2);border:1px solid var(--line);padding:5px 10px;border-radius:999px;white-space:nowrap}
.duel{--ts:clamp(1.75rem,8.6vw,2.6rem);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;margin:14px 0 6px}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.side.today{align-items:flex-end}
.cap{font-size:.8rem;font-weight:700;color:var(--ink-2)}
.vsb{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-family:var(--display);font-weight:800;color:var(--ink-2);font-size:1rem}
.crown{display:inline-flex;align-items:center;gap:4px;color:var(--gold-text)}
.prev{margin:6px 0 0;color:var(--ink-2);font-size:.92rem;font-weight:500;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.prev b{color:var(--ink);font-weight:800}
.entry{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.fld{height:48px;min-width:0;padding:0 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:1.05rem;font-weight:700}
.fld:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 30%,transparent)}
input[type=time].fld{flex:1 1 130px}
.dur{display:flex;align-items:center;gap:6px;flex:1 1 150px}
.dur .fld{width:64px;text-align:center;padding:0 6px}
.dur span{font-weight:800;color:var(--ink-2)}
.btn{height:48px;padding:0 22px;border-radius:999px;border:0;font-weight:800;font-size:1rem;background:var(--gold);color:var(--gold-ink);box-shadow:0 8px 18px -10px rgba(255,170,0,.9),inset 0 -3px 0 rgba(0,0,0,.14);transition:transform .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none;border:1px solid var(--line);padding:0 16px}
.link{background:none;border:0;min-height:44px;display:inline-flex;align-items:center;padding:0 8px;font-weight:700;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:.9rem}
.link.danger{color:var(--loss)}
.hint{margin:10px 0 0;color:var(--ink-2);font-size:.9rem}
.msg{margin:8px 0 0;min-height:1.2em;color:var(--loss);font-weight:700;font-size:.9rem}
.result{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-weight:600}
.badge{padding:4px 11px;border-radius:999px;font-weight:800;font-size:.82rem;background:var(--surface-2);border:1px solid var(--line)}
.badge.record{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.badge.win,.badge.tie{color:var(--win);border-color:currentColor;background:transparent}
.badge.loss{color:var(--loss);border-color:currentColor;background:transparent}
.spark{display:block;width:100%;height:44px;margin-top:14px;overflow:visible}
.spark-cap{margin:2px 0 0;font-size:.76rem;color:var(--ink-2)}
.foot{display:flex;justify-content:flex-end;margin-top:6px;gap:12px;align-items:center;flex-wrap:wrap}

/* ============ ADD PANEL ============ */
.add{margin-top:16px;border:2px dashed var(--line);border-radius:22px;padding:8px}
.add-toggle{width:100%;min-height:56px;display:flex;align-items:center;justify-content:center;gap:10px;background:none;border:0;font-weight:800;font-size:1.05rem;color:var(--ink);border-radius:16px}
.add-toggle:hover{background:var(--surface)}
.add-form{padding:10px 12px 14px;display:grid;gap:14px}
.add-form label,.add-form .lbl{font-weight:700;font-size:.9rem;display:block;margin-bottom:6px}
.add-form .fld{width:100%}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg label{margin:0;position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:grid;place-items:center;text-align:center;min-height:46px;padding:6px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem;cursor:pointer}
.seg input:checked+span{border-color:var(--gold-line);background:var(--gold);color:var(--gold-ink)}
.seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.kind-hint{margin:6px 0 0;font-size:.85rem;color:var(--ink-2)}

/* ============ LOGBOOK ============ */
.log{margin-top:34px}
.day{border-top:1px solid var(--line);padding:14px 0}
.day h4{margin:0 0 8px;font-weight:800;font-size:1rem;display:flex;justify-content:space-between;gap:10px}
.day h4 span{color:var(--ink-2);font-weight:600;font-size:.88rem}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.row .rname{font-weight:700}
.row .rval{font-family:var(--display);font-weight:800;font-size:1.35rem;text-align:right}
.row .rmeta{color:var(--ink-2);font-size:.84rem}
.row .chip{justify-self:end;font-size:.78rem;font-weight:800;padding:2px 10px;border-radius:999px;border:1px solid currentColor}
.chip.record{color:var(--gold-text)}.chip.win,.chip.tie{color:var(--win)}.chip.loss{color:var(--loss)}.chip.first,.chip.flat{color:var(--ink-2)}
.empty{color:var(--ink-2);margin:8px 0 0}
.more{margin-top:10px}
.sync{margin:26px 0 0;font-size:.82rem;color:var(--ink-2)}

/* ============ STAGE (celebrations) ============ */
.stage{position:fixed;inset:0;z-index:9990;overscroll-behavior:none;touch-action:none;display:grid;place-items:center;overflow:hidden;color:#fff;opacity:0;transition:opacity .28s ease;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.stage[hidden]{display:none}
.stage.on{opacity:1}
.stage.out{opacity:0}
.stage-bg{position:absolute;inset:0}
.stage.big .stage-bg{background:radial-gradient(ellipse at 50% 32%,#33248f 0%,#160f40 55%,#07051a 100%)}
.stage.small .stage-bg{background:rgba(8,6,28,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.stage.sad .stage-bg{background:radial-gradient(ellipse at 50% 25%,#2b3349 0%,#12151f 70%,#0a0c12 100%)}
.rays{position:absolute;left:50%;top:36%;width:190vmax;height:190vmax;margin:-95vmax 0 0 -95vmax;opacity:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,200,87,.17) 0 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 40%);mask:radial-gradient(circle,#000 0,transparent 40%);animation:spin 46s linear infinite}
.stage.big.revealed .rays{opacity:1;transition:opacity 1.2s}
@keyframes spin{to{transform:rotate(360deg)}}
.beams{position:absolute;inset:0;pointer-events:none}
.beam{position:absolute;top:-8%;left:calc(var(--x)*1% - 17vmax);width:34vmax;height:125%;transform-origin:50% 0;opacity:0;mix-blend-mode:screen;
  background:linear-gradient(180deg,var(--c) 0%,transparent 80%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);
  animation:beamIn 1s .1s both,sweep var(--d) ease-in-out var(--dl) infinite alternate}
@keyframes beamIn{to{opacity:.85}}
@keyframes sweep{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.stage.sad .beam{animation:beamIn 1.4s .2s both,flicker 2.8s 1.6s infinite;transform:none}
@keyframes flicker{0%,100%{opacity:.85}44%{opacity:.6}48%{opacity:.9}52%{opacity:.35}56%{opacity:.8}}
.floor{position:absolute;left:0;right:0;bottom:-8%;height:42%;pointer-events:none;background:radial-gradient(ellipse at 50% 100%,rgba(255,200,87,.34),transparent 65%);opacity:0}
.stage.big .floor{opacity:1}
.stage.small .floor{opacity:.6}
.sc{position:relative;z-index:2;width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.sc.shake{animation:shake .8s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{0%,100%{transform:none}10%{transform:translate(-10px,5px) rotate(-.5deg)}20%{transform:translate(9px,-6px) rotate(.5deg)}30%{transform:translate(-8px,-3px)}40%{transform:translate(7px,5px)}55%{transform:translate(-4px,2px)}70%{transform:translate(3px,-2px)}85%{transform:translate(-1px,1px)}}
.headline{margin:0;font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.86;letter-spacing:.005em;font-size:clamp(3.3rem,15vw,8rem)}
.headline.gold{background:linear-gradient(180deg,#fffbe0 0%,#ffd76a 42%,#ffab00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(255,190,50,.5))}
.stage.small .headline{font-size:clamp(2.6rem,11vw,5rem)}
.headline.green{color:#7dffd2;text-shadow:0 0 30px rgba(79,240,183,.45)}
.headline.slate{color:#aab4d4;font-size:clamp(2.4rem,10vw,4.6rem)}
.taskname{margin:0;font-weight:800;font-size:1.15rem;color:rgba(255,255,255,.9)}
.medal-wrap{width:clamp(84px,20vw,120px);filter:drop-shadow(0 0 22px rgba(255,200,87,.55))}
.medal-wrap svg{display:block;width:100%;height:auto}
.duelo{--ts:clamp(1.6rem,8.4vw,4.2rem);display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,18px);margin:8px 0 0;flex-wrap:nowrap}
.duelo .col{display:flex;flex-direction:column;align-items:center;gap:8px}
.duelo .cap{color:rgba(255,255,255,.75)}
.duelo .col.beaten{opacity:.5;filter:grayscale(1);transition:opacity .6s,filter .6s}
.duelo .arrow{color:rgba(255,255,255,.6);flex:none}
.duelo .u{color:rgba(255,255,255,.7)}
.duelo .c{color:#fff}
.delta{margin:6px 0 0;font-size:1.15rem;font-weight:700}
.taunt{margin:0;color:rgba(255,255,255,.75);font-weight:500}
.streakline{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:#ffd77a}
.cta{margin-top:12px;height:52px;padding:0 30px;border-radius:999px;border:0;font-weight:800;font-size:1.05rem;background:var(--gold);color:var(--gold-ink);box-shadow:0 10px 26px -10px rgba(255,180,0,.9),inset 0 -3px 0 rgba(0,0,0,.14)}
.cta.quiet{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.25)}
.timer{width:min(320px,70%);height:4px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:12px}
.timer i{display:block;height:100%;background:var(--gold);transform-origin:left;animation:drain var(--dur,4.8s) linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
/* reveal choreography */
.stage.pre .medal-wrap,.stage.pre .headline,.stage.pre .delta,.stage.pre .taunt,.stage.pre .streakline,.stage.pre .cta{opacity:0}
.stage.revealed .medal-wrap{animation:medalIn .9s cubic-bezier(.2,1.5,.3,1) both}
.stage.revealed .headline{animation:slam .75s cubic-bezier(.2,.9,.25,1) both}
.stage.revealed .delta{animation:rise .5s .55s both}
.stage.revealed .taunt{animation:rise .5s .8s both}
.stage.revealed .streakline{animation:rise .5s .95s both}
.stage.revealed .cta{animation:rise .5s 1.1s both}
@keyframes slam{0%{transform:scale(3.4) rotate(-5deg);opacity:0}55%{transform:scale(.92) rotate(1deg);opacity:1}78%{transform:scale(1.05)}100%{transform:none;opacity:1}}
@keyframes medalIn{0%{transform:scale(0) rotate(-200deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.stage.small .sc>*,.stage.sad .sc>*{animation:rise .45s both}
.stage.sad .sc>*{animation-duration:.9s}
.sadsvg{width:110px;height:auto;transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.flash{position:fixed;inset:0;z-index:9995;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 40%,#fff,rgba(255,232,150,.85) 45%,rgba(255,200,87,0) 80%)}
.flash.go{animation:flashgo .8s ease-out}
@keyframes flashgo{0%{opacity:.95}100%{opacity:0}}
#fx{position:fixed;inset:0;z-index:9999;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translate(-50%,20px);z-index:9996;max-width:min(92vw,460px);padding:12px 18px;border-radius:16px;background:#1a1741;color:#fff;border:1px solid rgba(255,255,255,.18);font-weight:700;text-align:center;opacity:0;transition:opacity .25s,transform .25s;box-shadow:0 18px 40px -16px rgba(0,0,0,.7)}
.toast[hidden]{display:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast small{display:block;font-weight:500;opacity:.8;margin-top:2px}

/* ============ PHONES ============ */
/* Scoreboard tiles scale to the box they sit in, so "12:45 AM" never spills on a small screen. */
.side{container-type:inline-size}
.side .tiles{font-size:clamp(1.15rem,21cqw,2.6rem)}
@media (max-width:560px){
  .wrap{padding-top:10px}
  .hero{gap:10px;padding-bottom:18px}
  .hero-row{gap:10px 14px}
  .grid{gap:14px}
  .bout{padding:16px 14px 14px 18px;border-radius:20px}
  .bout-h h3{font-size:1.5rem}
  .streak{padding:4px 9px;font-size:.8rem}
  .vsb{width:30px;height:30px;font-size:.9rem}
  .duel{gap:6px}
  /* entry row: time field gets its own line, big buttons underneath */
  .entry{gap:10px}
  .entry>input.fld,.entry>.dur{flex:1 1 100%}
  .dur .fld{flex:1 1 0;width:auto;min-width:0}
  .entry .btn{flex:1 1 0;height:52px}
  .entry .btn:not(.ghost){flex:2 1 0}
  .entry .link{flex:1 1 100%;justify-content:center}
  .foot{justify-content:space-between}
  .add{padding:6px}
  .add-form{padding:8px 8px 12px}
  .seg span{min-height:50px}
  .row{padding:10px}
  .row .rval{font-size:1.25rem}
  .cta{height:56px;width:min(100%,300px)}
  .toast{max-width:calc(100vw - 24px)}
}
@media (max-width:360px){
  .bout-h h3{font-size:1.35rem}
  .score{gap:8px}
  .score .sep{font-size:1.8rem}
  .kind{font-size:.76rem}
}
/* phones held sideways: keep the whole celebration on screen */
@media (max-height:520px) and (orientation:landscape){
  .sc{gap:4px}
  .medal-wrap{width:56px}
  .headline{font-size:clamp(2rem,15vh,4.4rem)}
  .stage.small .headline,.headline.slate{font-size:clamp(1.8rem,13vh,3.6rem)}
  .duelo{--ts:clamp(1.3rem,9vh,2.6rem);margin-top:2px}
  .sadsvg{width:64px}
  .delta,.taunt,.taskname{font-size:.95rem}
  .cta{margin-top:4px;height:46px}
}

/* ============ REDUCED MOTION ============ */
@media (prefers-reduced-motion:reduce){
  .beam,.rays,.sadsvg,.sc.shake,.portal i,.vs .ghost{animation:none!important}
  .beam{opacity:.5}
  .stage.revealed .headline,.stage.revealed .medal-wrap{animation-duration:.01s}
  .flip{animation:none}
}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="hero">
    <div class="topbar">
      <span class="today" id="today"></span>
      <button class="icon-btn" id="sound" data-act="sound" aria-label="Sound" aria-pressed="true"></button>
    </div>
    <h1 class="vs" aria-label="Me versus me"><span class="me">ME</span><span class="v">vs</span><span class="me ghost" aria-hidden="true">ME</span></h1>
    <div class="hero-row">
      <div class="score" id="score" aria-live="polite"></div>
      <span class="portal"><i></i><span id="portal"></span></span>
    </div>
    <p class="hero-sub" id="hero-sub"></p>
  </header>

  <section aria-labelledby="bouts-h">
    <div class="section-head">
      <h2 id="bouts-h">Records to break</h2>
      <p>Lower beats higher. Log anytime today.</p>
    </div>
    <div class="grid" id="cards"></div>

    <div class="add" id="add"></div>
  </section>

  <section class="log" aria-labelledby="log-h">
    <div class="section-head"><h2 id="log-h">Logbook</h2></div>
    <div id="logbook"></div>
  </section>

  <p class="sync" id="sync"></p>
</div>

<!-- Celebration stage -->
<div id="stage" class="stage" hidden role="dialog" aria-modal="true" aria-label="Result">
  <div class="stage-bg"></div>
  <div class="rays"></div>
  <div class="beams" id="beams"></div>
  <div class="floor"></div>
  <div class="sc" id="sc"></div>
</div>
<div id="flash" class="flash"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const pad2 = n => String(n).padStart(2, '0');
const rm = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } };
const clone = o => JSON.parse(JSON.stringify(o));

const LIVE_KEY = 'mvm.live.v1', SOUND_KEY = 'mvm.sound';

/* =====================================================================
   Time formatting  (every value is stored as minutes; LOWER IS ALWAYS BETTER)
   clock    : minutes since midnight
   night    : bedtime; 12:00 to 23:59 = 720..1439, after-midnight = 1440..2159 (later)
   duration : minutes
   ===================================================================== */
const KINDS = {
  clock:    { label: 'Clock time', hint: 'Wake-ups, starts, meals. Earlier is better.', less: 'earlier', more: 'later', word: 'Before' },
  night:    { label: 'Bedtime',    hint: 'Times after midnight count as later.',        less: 'earlier', more: 'later', word: 'Before' },
  duration: { label: 'Duration',   hint: 'Hours and minutes. Less is better.',          less: 'less',    more: 'more',  word: 'Under'  }
};
function clockParts(m) {
  m = ((m % 1440) + 1440) % 1440;
  const h = Math.floor(m / 60), mm = m % 60;
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  return { h12, mm, ap: h >= 12 ? 'PM' : 'AM' };
}
function fmt(kind, v) {
  if (kind === 'duration') { const h = Math.floor(v / 60), m = v % 60; return h ? `${h}h ${pad2(m)}m` : `${m}m`; }
  const c = clockParts(v); return `${c.h12}:${pad2(c.mm)} ${c.ap}`;
}
function fmtDur(m) {
  m = Math.abs(Math.round(m));
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h}h ${pad2(r)}m` : `${h}h`;
}
const D = v => ({ t: 'd', v });
const digits = s => String(s).split('').map(D);
function parts(kind, v) {
  if (kind === 'duration') {
    const h = Math.floor(v / 60), m = v % 60;
    return h ? [...digits(h), { t: 'u', v: 'h' }, ...digits(pad2(m)), { t: 'u', v: 'm' }]
             : [...digits(m), { t: 'u', v: 'm' }];
  }
  const c = clockParts(v);
  return [...digits(c.h12), { t: 'c', v: ':' }, ...digits(pad2(c.mm)), { t: 'u', v: c.ap }];
}
function placeholder(kind) {
  return kind === 'duration'
    ? [D('–'), { t: 'u', v: 'h' }, D('–'), D('–'), { t: 'u', v: 'm' }]
    : [D('–'), { t: 'c', v: ':' }, D('–'), D('–'), { t: 'u', v: '' }];
}
function tilesHTML(ps, cls = '', flip = false) {
  let i = 0;
  return `<span class="tiles ${cls}">` + ps.map(p => {
    if (p.t === 'd') return `<b class="t${flip ? ' flip' : ''}"${flip ? ` style="--i:${i++}"` : ''}>${esc(p.v)}</b>`;
    if (p.t === 'c') return '<i class="c">:</i>';
    return p.v ? `<small class="u">${esc(p.v)}</small>` : '';
  }).join('') + '</span>';
}

/* =====================================================================
   State
   ===================================================================== */
function seed() {
  return { v: 1, updatedAt: 0, tasks: [
    { id: 'sleep',  name: 'Sleep on time',      kind: 'night',    record: 27 * 60,      builtin: true, logs: {} },
    { id: 'wake',   name: 'Wake up early',      kind: 'clock',    record: 9 * 60,       builtin: true, logs: {} },
    { id: 'work',   name: 'Start work',         kind: 'clock',    record: 15 * 60 + 30, builtin: true, logs: {} },
    { id: 'screen', name: 'Phone screen time',  kind: 'duration', record: 4 * 60 + 47,  builtin: true, logs: {} }
  ] };
}
const validState = s => s && Array.isArray(s.tasks) && s.tasks.every(t => t && typeof t.id === 'string' && t.logs && typeof t.record === 'number');
function loadState(key) {
  const raw = lsGet(key); if (!raw) return null;
  try { const s = JSON.parse(raw); return validState(s) ? s : null; } catch (e) { return null; }
}
let live = loadState(LIVE_KEY) || seed();
const S = () => live;

function saveLocal() { lsSet(LIVE_KEY, JSON.stringify(live)); }
function touch() {
  live.updatedAt = Date.now();
  saveLocal();
  cloudQueue();
}

/* ---------- dates ---------- */
const nowDate = () => new Date();
const keyOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayKey = () => keyOf(nowDate());
function dateFromKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
const dayDiff = (a, b) => Math.round((dateFromKey(b) - dateFromKey(a)) / 86400000);
function addDays(k, n) { const d = dateFromKey(k); d.setDate(d.getDate() + n); return keyOf(d); }
function niceDate(k) {
  const n = dayDiff(k, todayKey());
  if (n === 0) return 'Today';
  if (n === 1) return 'Yesterday';
  return dateFromKey(k).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
}
const prevWord = k => (k && dayDiff(k, todayKey()) === 1 ? 'yesterday' : 'your last log');

/* =====================================================================
   Core logic
   ===================================================================== */
const POS = new Set(['record', 'win', 'tie']);
function judge(v, best, prev) {
  if (v < best) return 'record';
  if (v === best) return 'tie';
  if (prev == null) return 'first';
  if (v < prev) return 'win';
  if (v > prev) return 'loss';
  return 'flat';
}
function analyze(t) {
  const dates = Object.keys(t.logs).sort();
  let best = t.record, prev = null, prevDate = null;
  const entries = [];
  for (const d of dates) {
    const v = t.logs[d];
    entries.push({ date: d, value: v, status: judge(v, best, prev), bestBefore: best, prev, prevDate });
    if (v < best) best = v;
    prev = v; prevDate = d;
  }
  let streak = 0;
  for (let i = entries.length - 1; i >= 0 && POS.has(entries[i].status); i--) streak++;
  return { entries, best, streak };
}
function cardModel(t) {
  const A = analyze(t), tk = todayKey();
  const todayE = A.entries.find(e => e.date === tk) || null;
  const before = A.entries.filter(e => e.date < tk);
  const prevE = before.length ? before[before.length - 1] : null;
  return { A, todayE, prevE, bestBefore: todayE ? todayE.bestBefore : A.best };
}
function todayScore() {
  let you = 0, old = 0, logged = 0; const tasks = S().tasks, tk = todayKey();
  for (const t of tasks) {
    const e = analyze(t).entries.find(x => x.date === tk);
    if (!e) continue; logged++;
    if (POS.has(e.status)) you++; else if (e.status === 'loss') old++;
  }
  return { you, old, logged, total: tasks.length };
}
const recordsBroken = () => S().tasks.reduce((n, t) => n + analyze(t).entries.filter(e => e.status === 'record').length, 0);
function isPerfect() {
  const tasks = S().tasks, tk = todayKey();
  if (tasks.length < 2) return false;
  return tasks.every(t => { const e = analyze(t).entries.find(x => x.date === tk); return e && POS.has(e.status); });
}

/* =====================================================================
   Copy
   ===================================================================== */
const HEAD = {
  record: ['Record broken', 'You beat you', 'Old you is history', 'New all-time best'],
  win:    ['You won the day', 'Beat yesterday', 'Round won'],
  tie:    ['Matched your best'],
  loss:   ["Yesterday's you won", 'Round lost', 'Old you scores'],
  sweep:  ['Clean sweep']
};
const TAUNT = {
  record: ['Old you never saw that coming.', 'Remember this feeling. Chase it tomorrow.', 'That is the version of you that wins.'],
  win:    ["Yesterday's you just lost.", 'Small win, real win.', 'Keep stacking these.'],
  tie:    ['Tied with old you. Beat it tomorrow.'],
  loss:   ['Tomorrow is a rematch.', 'One round is not the fight.', 'Use it. Win the next one.'],
  sweep:  ['Old you did not score once today.', 'This is what a proud day feels like.']
};
const BADGE = { record: 'Record', win: 'Won', loss: 'Lost', tie: 'Tied', first: 'Baseline', flat: 'Even' };
function resultText(t, e) {
  const K = KINDS[t.kind], pw = prevWord(e.prevDate);
  switch (e.status) {
    case 'record': return `New all-time best, ${fmtDur(e.bestBefore - e.value)} ${K.less} than the old one.`;
    case 'win':    return `Won the day. ${fmtDur(e.prev - e.value)} ${K.less} than ${pw}.`;
    case 'loss':   return `Old you takes this round. ${fmtDur(e.value - e.prev)} ${K.more} than ${pw}.`;
    case 'tie':    return 'Matched your all-time best.';
    case 'first':  return 'Baseline set. The fight starts tomorrow.';
    default:       return `Same as ${pw}. Edge it next time.`;
  }
}

/* =====================================================================
   SVG bits
   ===================================================================== */
const MEDAL = `<svg viewBox="0 0 120 140" aria-hidden="true"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ffc857"/><stop offset="1" stop-color="#c98a00"/></linearGradient></defs><path d="M28 0h24l16 50-26 12z" fill="#ff5f7a"/><path d="M92 0H68L52 50l26 12z" fill="#4c7dff"/><circle cx="60" cy="90" r="42" fill="url(#mg)"/><circle cx="60" cy="90" r="33" fill="none" stroke="#a86b00" stroke-width="3" opacity=".55"/><path d="M60 64l7.6 15.5 17 2.5-12.3 12 2.9 17L60 103l-15.2 8 2.9-17-12.3-12 17-2.5z" fill="#fff8d6" stroke="#a86b00" stroke-width="2" stroke-linejoin="round"/></svg>`;
const SADBALLOON = `<svg class="sadsvg" viewBox="0 0 120 160" aria-hidden="true"><path d="M60 128c-7 9 7 13 0 24" stroke="#8592b5" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M60 20c28 0 45 22 41 48-3 22-22 46-41 46S22 90 19 68C15 42 32 20 60 20z" fill="#5f6b8e"/><path d="M53 113l7 9 7-9z" fill="#5f6b8e"/><circle cx="44" cy="64" r="4.5" fill="#1c2233"/><circle cx="76" cy="64" r="4.5" fill="#1c2233"/><path d="M45 92q15-15 30 0" stroke="#1c2233" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M79 72q5 8 0 12q-5-4 0-12z" fill="#7cc4ff"/><path d="M34 36q6-8 17-11" stroke="#9aa6c8" stroke-width="4" stroke-linecap="round" fill="none" opacity=".55"/></svg>`;
const flame = (s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z" fill="#ff9d2e"/><path d="M12 22a3 3 0 0 0 3-3c0-2-2-3-3-5-1 2-3 3-3 5a3 3 0 0 0 3 3z" fill="#ffe08a"/></svg>`;
const ICON_SOUND_ON = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>`;
const ICON_SOUND_OFF = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>`;
const ICON_PLUS = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`;
const CROWN = `<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z" fill="#ffc857" stroke="#a86b00" stroke-width="1.4" stroke-linejoin="round"/></svg>`;

/* =====================================================================
   Sound (all synthesized with WebAudio, no files)
   ===================================================================== */
const Sound = (() => {
  let ctx = null, master = null, nbuf = null, enabled = lsGet(SOUND_KEY) !== 'off';
  function ensure() {
    if (!enabled) return false;
    try {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
        ctx = new AC();
        const comp = ctx.createDynamicsCompressor();
        master = ctx.createGain(); master.gain.value = 0.8;
        master.connect(comp); comp.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
      return true;
    } catch (e) { return false; }
  }
  function tone(f, t0, d, o = {}) {
    if (!ensure()) return;
    const t = ctx.currentTime + t0, osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
    let node = osc;
    if (o.lp) { const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = o.lp; osc.connect(lp); node = lp; }
    node.connect(g); g.connect(master);
    const pk = o.g == null ? 0.2 : o.g, at = o.a == null ? 0.008 : o.a, rl = o.r == null ? 0.08 : o.r;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(pk, t + at);
    g.gain.setValueAtTime(pk, t + Math.max(at, d - rl));
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.start(t); osc.stop(t + d + 0.05);
    if (o.vib) {
      const lfo = ctx.createOscillator(), lg = ctx.createGain();
      lfo.frequency.value = o.vib[0]; lg.gain.value = o.vib[1];
      lfo.connect(lg); lg.connect(osc.frequency); lfo.start(t); lfo.stop(t + d + 0.05);
    }
  }
  function noiseBuf() {
    if (nbuf) return nbuf;
    const len = ctx.sampleRate * 2; nbuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = nbuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return nbuf;
  }
  function noise(t0, d, o = {}) {
    if (!ensure()) return;
    const t = ctx.currentTime + t0, src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf(); src.loop = true;
    f.type = o.type || 'lowpass'; f.frequency.setValueAtTime(o.f || 2000, t);
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + d);
    f.Q.value = o.q || 0.7;
    const pk = o.g == null ? 0.2 : o.g;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(pk, t + (o.a == null ? 0.005 : o.a));
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t, Math.random()); src.stop(t + d + 0.05);
  }
  const api = {
    unlock: ensure,
    get enabled() { return enabled; },
    toggle() { enabled = !enabled; lsSet(SOUND_KEY, enabled ? 'on' : 'off'); if (enabled) { ensure(); api.pop(); } return enabled; },
    hush() { if (!ctx || !master) return; const t = ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(0, t + 0.25); master.gain.linearRampToValueAtTime(0.8, t + 0.6); },
    pop(t = 0) { noise(t, 0.09, { type: 'highpass', f: 1500, g: 0.35 }); tone(700, t, 0.09, { type: 'triangle', to: 120, g: 0.25 }); },
    tick() { tone(1900, 0, 0.025, { type: 'square', g: 0.035, a: 0.002, r: 0.012 }); },
    drumroll(dur) {
      const step = 0.055, n = Math.floor(dur / step);
      for (let i = 0; i < n; i++) { const g = 0.05 + 0.2 * (i / n); noise(i * step, 0.05, { type: 'bandpass', f: 1800, q: 1, g }); tone(180, i * step, 0.05, { type: 'triangle', g: g * 0.7, to: 120, a: 0.002 }); }
    },
    crash(t = 0) { noise(t, 1.6, { type: 'highpass', f: 5500, to: 3000, g: 0.32, a: 0.003 }); noise(t, 0.5, { type: 'bandpass', f: 900, g: 0.18 }); },
    fanfare(t = 0) {
      const seq = [[392, 0, 0.14], [523.25, 0.14, 0.14], [659.25, 0.28, 0.14], [783.99, 0.42, 0.5], [659.25, 0.92, 0.12], [783.99, 1.04, 0.12]];
      seq.forEach(([f, at, d]) => { tone(f, t + at, d + 0.1, { type: 'sawtooth', lp: 2600, g: 0.1, a: 0.01, r: 0.12 }); tone(f * 2, t + at, d + 0.1, { type: 'square', lp: 3200, g: 0.025 }); });

      }
      case 'drop': c.strokeStyle = 'rgba(170,190,225,' + p.a + ')'; c.lineWidth = 1.3; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 1.2, p.y - p.len); c.stroke(); break;
      case 'dot': c.globalAlpha = 1 - p.life / p.max; c.fillStyle = 'rgba(170,190,225,.9)'; c.beginPath(); c.arc(p.x, p.y, 1.5, 0, 6.283); c.fill(); c.globalAlpha = 1; break;
      case 'rkt': c.globalAlpha = 1; c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.lineCap = 'round'; c.beginPath(); c.moveTo(p.px, p.py + 14); c.lineTo(p.x, p.y); c.stroke(); break;

/* =====================================================================
   Celebration director
   ===================================================================== */
const stage = $('#stage'), scEl = $('#sc');
const Q = []; let playing = false, cur = null;
const later = (fn, ms) => { const id = setTimeout(fn, ms); cur.timers.push(id); return id; };
const BUZZ = { record: [90, 50, 90, 50, 320], sweep: [90, 50, 90, 50, 90, 50, 400], win: [70, 40, 110], tie: [90], loss: [260], first: [30], added: [30] };
function buzz(type) { try { if (Sound.enabled && !rm() && navigator.vibrate && BUZZ[type]) navigator.vibrate(BUZZ[type]); } catch (e) { /* not supported */ } }
function celebrate(ev) { Q.push(ev); if (!playing) next(); }
function next() {
  const ev = Q.shift();
  if (!ev) { playing = false; return; }
  playing = true; buzz(ev.type);
  (Show[ev.type] || Show.flat)(ev);
}
const beamsHTML = list => list.map(b => `<i class="beam" style="--x:${b[0]};--c:${b[1]};--d:${b[2]}s;--dl:${b[3]}s"></i>`).join('');
const BEAMS_BIG = beamsHTML([[8, 'rgba(255,200,87,.6)', 3.4, -0.5], [30, 'rgba(255,95,162,.5)', 4.1, -1.6], [50, 'rgba(255,255,255,.42)', 3.0, -2.2], [70, 'rgba(92,225,255,.5)', 4.4, -0.9], [92, 'rgba(155,123,255,.55)', 3.7, -2.8]]);
const BEAMS_SMALL = beamsHTML([[20, 'rgba(255,200,87,.5)', 3.6, -1], [50, 'rgba(255,255,255,.34)', 3.1, -2], [80, 'rgba(92,225,255,.4)', 4, -0.4]]);
const BEAMS_SAD = beamsHTML([[50, 'rgba(190,205,235,.42)', 3, 0]]);

function open(cls, html, beams) {
  cur = { timers: [], raf: 0, canDismiss: false };
  scEl.classList.remove('shake');
  scEl.innerHTML = html; $('#beams').innerHTML = beams || '';
  stage.className = 'stage ' + cls; stage.hidden = false;
  document.documentElement.style.overflow = 'hidden';
  void stage.offsetWidth; stage.classList.add('on');
}
function close() {
  if (!cur || !cur.canDismiss) return;
  const c = cur; cur = null;
  c.timers.forEach(clearTimeout); cancelAnimationFrame(c.raf);
  FX.fade(); Sound.hush();
  stage.classList.remove('on'); stage.classList.add('out');
  setTimeout(() => {
    stage.hidden = true; stage.className = 'stage'; scEl.innerHTML = '';
    document.documentElement.style.overflow = '';
    next();
  }, 320);
}
function allowDismiss(ms, focusCta) {
  later(() => { cur.canDismiss = true; if (focusCta) { const b = $('#cta'); if (b) b.focus({ preventScroll: true }); } }, ms);
}
function flash() { if (rm()) return; const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
function shake() { if (rm()) return; scEl.classList.remove('shake'); void scEl.offsetWidth; scEl.classList.add('shake'); }
function rollTiles(el, kind, from, to, dur) {
  const c = cur, t0 = performance.now(); let lastV = null, lastTick = 0;
  function step(now) {
    if (cur !== c) return;
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3), v = Math.round(from + (to - from) * e);
    if (v !== lastV) { el.innerHTML = tilesHTML(parts(kind, v), 'hot'); lastV = v; if (now - lastTick > 70) { Sound.tick(); lastTick = now; } }
    if (p < 1) c.raf = requestAnimationFrame(step);
  }
  c.raf = requestAnimationFrame(step);
}
function duelHTML(kind, l, r) {
  const col = (o, cls) => `<div class="col ${o.cls || ''}"><span class="cap">${o.cap}</span><div${o.id ? ` id="${o.id}"` : ''}>${tilesHTML(parts(kind, o.v), o.t)}</div></div>`;
  return `<div class="duelo">${col(l)}<svg class="arrow" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M8 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>${col(r)}</div>`;
}
const streakLine = n => (n >= 2 ? `<p class="streakline">${flame(20)} ${n} in a row</p>` : '');

const Show = {};

/* ---- the big one: all-time record ---- */
Show.record = ev => {
  const name = esc(ev.name);
  open('big pre', `
    <div class="medal-wrap">${MEDAL}</div>
    <h2 class="headline gold">${pick(HEAD.record)}</h2>
    <p class="taskname">${name}</p>
    ${duelHTML(ev.kind, { cap: 'Old you', v: ev.oldBest, t: 'dim', id: 'old-tiles', cls: 'oldcol' }, { cap: 'You', v: ev.oldBest, t: 'hot', id: 'new-tiles' })}
    <p class="delta">${dline(ev, ev.oldBest, true)} than your old best.</p>
    <p class="taunt">${pick(TAUNT.record)}</p>
    ${streakLine(ev.streak)}
    <button class="cta" id="cta" data-act="close">Keep going</button>`, BEAMS_BIG);
  Sound.drumroll(1.35);

  later(() => revealBig(true), rm() ? 800 : 1750);
};
Show.sweep = ev => {
  open('big pre', `
    <div class="medal-wrap">${MEDAL}</div>
    <h2 class="headline gold">${pick(HEAD.sweep)}</h2>
    <p class="taskname">${ev.count} for ${ev.count} today</p>
    <p class="delta">Every record beat old you.</p>

function revealBig(rolled) {

  Sound.crash(); Sound.fanfare(0.05); Sound.cheer(0.2);
  FX.cannons(1.2, 90);
  [0, 260, 520].forEach(ms => later(() => FX.rocket(), ms));
  later(() => { FX.set('shower', 2.4); FX.set('glitter', 1.2); FX.set('fw', 1000); if (!rm()) FX.set('flash', 0.05); }, 400);
  later(() => FX.cannons(0.8, 40), 1300);
  allowDismiss(rm() ? 300 : 2200, true);
}

const cap = d => (d ? niceDate(d) : 'Before');

/* ---- the sad party ---- */
Show.loss = ev => {
  open('sad revealed', `
    ${SADBALLOON}
    <h2 class="headline slate">${pick(HEAD.loss)}</h2>
    <p class="taskname">${esc(ev.name)}</p>
    ${duelHTML(ev.kind, { cap: cap(ev.prevDate), v: ev.prev, t: 'neutral' }, { cap: 'Today', v: ev.value, t: 'loss' })}
    <p class="delta">${dline(ev, ev.prev, false)} than ${prevWord(ev.prevDate)}.</p>
    <p class="taunt">${pick(TAUNT.loss)}</p>
    <button class="cta quiet" id="cta" data-act="close">Rematch tomorrow</button>
    <div class="timer"><i></i></div>`, BEAMS_SAD);
  $('.timer').style.setProperty('--dur', '6500ms');
  Sound.sad();
  FX.set('rain', 9); FX.set('sad', 1.1);
  allowDismiss(900, false);
  later(() => { cur.canDismiss = true; close(); }, 6500);
};

/* ---- neutral moments (toasts) ---- */
function toast(html, ms, cb) {
  const el = $('#toast');
  cur = { timers: [], raf: 0, canDismiss: false, toast: true };
  el.innerHTML = html; el.hidden = false; void el.offsetWidth; el.classList.add('on');
  if (cb) cb();
  later(() => el.classList.remove('on'), ms);
  later(() => { el.hidden = true; cur = null; next(); }, ms + 300);
}
Show.first = ev => toast(`Baseline set for ${esc(ev.name)}<small>The fight starts tomorrow. Beat ${fmt(ev.kind, ev.value)}.</small>`, 3200, () => { Sound.pop(); FX.pop(window.innerWidth / 2, window.innerHeight - 90, 22, ['#ffc857', '#fff2b8']); });
Show.flat = ev => toast(`Dead even with ${prevWord(ev.prevDate)}<small>${esc(ev.name)}. Edge it tomorrow.</small>`, 2800, () => Sound.tick());
Show.added = ev => toast(`New rival added: ${esc(ev.name)}<small>Beat ${fmt(ev.kind, ev.value)} and the party starts.</small>`, 3200, () => { Sound.pop(); Sound.pop(0.1); FX.pop(window.innerWidth / 2, window.innerHeight - 90, 36); });

/* close on tap, Esc, or the button */
stage.addEventListener('click', () => close());
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

/* =====================================================================
   Cloud sync (private per-viewer doc) with local-first fallback
   ===================================================================== */
const Cloud = { ref: null, dirty: false, busy: false, t: 0, status: 'local' };
function setSync(s) { Cloud.status = s; renderSync(); }
function cloudQueue() { if (!Cloud.ref) return; Cloud.dirty = true; clearTimeout(Cloud.t); Cloud.t = setTimeout(cloudFlush, 700); }
async function cloudFlush() {
  if (!Cloud.ref || Cloud.busy) return;
  Cloud.busy = true;
  try {
    while (Cloud.dirty) { Cloud.dirty = false; await Cloud.ref.set({ json: JSON.stringify(live), updatedAt: live.updatedAt || 0 }); }
    setSync('cloud');
  } catch (e) { setSync('error'); }
  Cloud.busy = false;
}
async function initCloud() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    Cloud.ref = db.doc('data/users/' + uid + '/tracker');
    const snap = await Cloud.ref.get();
    let remote = null;
    if (snap.exists) { const d = snap.data(); if (d && d.json) { try { remote = JSON.parse(d.json); } catch (e) { remote = null; } } }
    if (remote && validState(remote)) {
      if ((remote.updatedAt || 0) > (live.updatedAt || 0)) { live = remote; lsSet(LIVE_KEY, JSON.stringify(live)); renderAll(); }
      else if ((live.updatedAt || 0) > (remote.updatedAt || 0)) cloudQueue();
    } else if ((live.updatedAt || 0) > 0) cloudQueue();
    setSync('cloud');
  } catch (e) { setSync('error'); }
}

/* =====================================================================
   Rendering
   ===================================================================== */
const drafts = {};            // typed-but-not-logged input values, keyed "taskId:part"
const editing = new Set();    // task ids being re-logged today
const removing = new Set();   // task ids awaiting remove confirmation
let justLogged = null, logLimit = 7, addOpen = false, addKind = 'clock', renderedDay = todayKey();
const STATE_CLASS = { record: 'hot', win: 'win', tie: 'hot', loss: 'loss', first: 'neutral', flat: 'neutral' };

function sparkHTML(A) {
  const es = A.entries.slice(-14); if (es.length < 2) return '';
  const vals = es.map(e => e.value), best = A.best;
  let mn = Math.min(...vals, best), mx = Math.max(...vals, best); if (mx === mn) { mx += 1; mn -= 1; }
  const Wd = 300, Ht = 40, pad = 6, X = i => (es.length === 1 ? Wd / 2 : 4 + (i / (es.length - 1)) * (Wd - 8)), Y = v => pad + ((v - mn) / (mx - mn)) * (Ht - 2 * pad);
  const line = es.map((e, i) => `${X(i).toFixed(1)},${Y(e.value).toFixed(1)}`).join(' ');
  const col = { record: '#ffb000', win: '#2fd6a0', tie: '#ffb000', loss: '#ff6b81', first: '#8b93c4', flat: '#8b93c4' };
  const dots = es.map((e, i) => `<line x1="${X(i).toFixed(1)}" y1="${Y(e.value).toFixed(1)}" x2="${(X(i) + 0.01).toFixed(2)}" y2="${Y(e.value).toFixed(1)}" stroke="${col[e.status]}" stroke-width="7" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`).join('');
  return `<svg class="spark" viewBox="0 0 ${Wd} ${Ht}" preserveAspectRatio="none" role="img" aria-label="Trend of your last ${es.length} logs">
    <line x1="0" x2="${Wd}" y1="${Y(best).toFixed(1)}" y2="${Y(best).toFixed(1)}" stroke="#ffb000" stroke-width="1.5" stroke-dasharray="5 5" vector-effect="non-scaling-stroke" opacity=".8"/>
    <polyline points="${line}" fill="none" stroke="currentColor" opacity=".45" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>${dots}</svg>
    <p class="spark-cap">Last ${es.length} logs. Higher is better, the dashed line is your record.</p>`;
}
function entryHTML(t, todayE, editingNow) {
  const dv = part => {
    const k = t.id + ':' + part; if (k in drafts) return drafts[k];
    if (editingNow && todayE) {
      const v = todayE.value;
      if (t.kind === 'duration') return part === 'h' ? String(Math.floor(v / 60)) : String(v % 60);
      const m = v % 1440; return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60);
    }
    return '';
  };
  const input = t.kind === 'duration'
    ? `<div class="dur"><input class="fld" type="number" inputmode="numeric" min="0" max="23" placeholder="0" data-tid="${t.id}" data-part="h" value="${esc(dv('h'))}" aria-label="Hours"><span>h</span><input class="fld" type="number" inputmode="numeric" min="0" max="59" placeholder="00" data-tid="${t.id}" data-part="m" value="${esc(dv('m'))}" aria-label="Minutes"><span>m</span></div>`
    : `<input class="fld" type="time" step="60" data-tid="${t.id}" data-part="time" value="${esc(dv('time'))}" aria-label="Time for ${esc(t.name)}">`;
  const now = t.kind === 'duration' ? '' : `<button class="btn ghost" data-act="now">Now</button>`;
  const cancel = editingNow ? `<button class="link" data-act="cancel-edit">Cancel</button>` : '';
  return `<div class="entry">${input}${now}<button class="btn" data-act="log">${editingNow ? 'Update log' : 'Log it'}</button>${cancel}</div><p class="msg" role="status"></p>`;
}
function cardHTML(t) {
  const { A, todayE, prevE, bestBefore } = cardModel(t);
  const K = KINDS[t.kind], ed = editing.has(t.id);
  const state = todayE && !ed ? todayE.status : 'pending';
  const fresh = justLogged === t.id;
  const todayTiles = state === 'pending' ? tilesHTML(placeholder(t.kind), 'dim') : tilesHTML(parts(t.kind, todayE.value), STATE_CLASS[state], fresh);
  const isNewBest = state === 'record';
  let hint = '';
  if (state === 'pending') {
    const w = K.word;
    if (prevE && prevE.value > bestBefore) hint = `${w} ${fmt(t.kind, prevE.value)} wins the day. ${w} ${fmt(t.kind, bestBefore)} breaks the record.`;
    else if (prevE) hint = `${w} ${fmt(t.kind, bestBefore)} wins the day and breaks the record.`;
    else hint = `Today sets your baseline. ${w} ${fmt(t.kind, bestBefore)} breaks the record.`;
  }
  const prevLine = prevE
    ? `<p class="prev"><span>${niceDate(prevE.date)}</span><b>${fmt(t.kind, prevE.value)}</b></p>`
    : `<p class="prev">No earlier log yet. Today sets the baseline.</p>`;
  const body = state === 'pending'
    ? entryHTML(t, todayE, ed) + `<p class="hint">${hint}</p>`
    : `<div class="result"><span class="badge ${state}">${BADGE[state]}</span><span>${esc(resultText(t, todayE))}</span><button class="link" data-act="change">Change</button></div>`;
  const streak = A.streak >= 2 ? `<span class="streak" title="Wins in a row">${flame(15)} ${A.streak} in a row</span>` : '';
  let foot = '';
  if (!t.builtin) {
    foot = removing.has(t.id)
      ? `<div class="foot"><span>Remove this task and its logs?</span><button class="link danger" data-act="remove-yes">Yes, remove</button><button class="link" data-act="remove-no">Keep</button></div>`
      : `<div class="foot"><button class="link" data-act="remove">Remove task</button></div>`;
  }
  return `<article class="bout${fresh ? ' fresh' : ''}" data-tid="${t.id}" data-state="${state}">
    <div class="bout-h"><div><h3>${esc(t.name)}</h3><span class="kind">${K.label}</span></div>${streak}</div>
    <div class="duel">
      <div class="side"><span class="cap${isNewBest ? ' crown' : ''}">${isNewBest ? CROWN : ''}All-time best</span>${tilesHTML(parts(t.kind, A.best), 'gold')}</div>
      <span class="vsb" aria-hidden="true">vs</span>
      <div class="side today"><span class="cap">Today</span>${todayTiles}</div>
    </div>
    ${prevLine}
    ${body}
    ${sparkHTML(A)}
    ${foot}
  </article>`;
}
function renderCards() { $('#cards').innerHTML = S().tasks.map(cardHTML).join(''); }

function valueFieldHTML(kind) {
  return kind === 'duration'
    ? `<div class="dur"><input class="fld" type="number" inputmode="numeric" min="0" max="23" placeholder="4" id="add-h" aria-label="Record hours"><span>h</span><input class="fld" type="number" inputmode="numeric" min="0" max="59" placeholder="47" id="add-m" aria-label="Record minutes"><span>m</span></div>`
    : `<input class="fld" type="time" step="60" id="add-time" aria-label="Current record time">`;
}
function renderAdd() {
  const el = $('#add');
  if (!addOpen) { el.innerHTML = `<button class="add-toggle" data-act="add-toggle">${ICON_PLUS} Add a record to break</button>`; return; }
  const seg = Object.keys(KINDS).map(k => `<label><input type="radio" name="kind" value="${k}" ${k === addKind ? 'checked' : ''}><span>${KINDS[k].label}</span></label>`).join('');
  el.innerHTML = `<div class="add-form">
    <div><label for="add-name">Name</label><input class="fld" id="add-name" maxlength="40" placeholder="e.g. First glass of water" autocomplete="off"></div>
    <div><span class="lbl" id="kind-l">Type</span><div class="seg" role="radiogroup" aria-labelledby="kind-l">${seg}</div><p class="kind-hint" id="kind-hint">${KINDS[addKind].hint}</p></div>
    <div><span class="lbl">Current record</span><div id="add-val">${valueFieldHTML(addKind)}</div></div>
    <p class="msg" id="add-msg" role="status"></p>
    <div class="entry" style="margin-top:0"><button class="btn" data-act="add-submit">Add record</button><button class="btn ghost" data-act="add-toggle">Cancel</button></div>
  </div>`;
}
function renderHero() {
  const sc = todayScore(), rb = recordsBroken(), num = n => tilesHTML(digits(n), 'neutral');
  $('#today').textContent = nowDate().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  $('#score').innerHTML = `<span class="who">You</span>${num(sc.you)}<span class="sep">:</span>${num(sc.old)}<span class="who">Old you</span>`;
  $('#hero-sub').textContent = `${sc.logged} of ${sc.total} logged today. ${rb === 0 ? 'No records broken yet.' : rb === 1 ? '1 record broken so far.' : rb + ' records broken so far.'}`;
  const b = $('#sound'); const on = Sound.enabled;
  b.innerHTML = on ? ICON_SOUND_ON : ICON_SOUND_OFF; b.setAttribute('aria-pressed', String(on)); b.setAttribute('aria-label', on ? 'Sound on' : 'Sound off');
}
function renderLog() {
  const byDay = {};
  S().tasks.forEach(t => analyze(t).entries.forEach(e => { (byDay[e.date] = byDay[e.date] || []).push({ t, e }); }));
  const days = Object.keys(byDay).sort().reverse();
  if (!days.length) { $('#logbook').innerHTML = `<p class="empty">Nothing logged yet. Log your first record above and the fight begins.</p>`; return; }
  const shown = days.slice(0, logLimit);
  $('#logbook').innerHTML = shown.map(d => {
    const rows = byDay[d].map(({ t, e }) => {
      const K = KINDS[t.kind];
      let meta = '';
      if (e.status === 'record') meta = `${fmtDur(e.bestBefore - e.value)} ${K.less} than the old best`;
      else if (e.status === 'win') meta = `${fmtDur(e.prev - e.value)} ${K.less} than the last log`;
      else if (e.status === 'loss') meta = `${fmtDur(e.value - e.prev)} ${K.more} than the last log`;
      return `<li class="row"><span class="rname">${esc(t.name)}</span><span class="rval">${fmt(t.kind, e.value)}</span><span class="rmeta">${meta}</span><span class="chip ${e.status}">${BADGE[e.status]}</span></li>`;
    }).join('');
    return `<div class="day"><h4>${niceDate(d)}<span>${byDay[d].length} of ${S().tasks.length} logged</span></h4><ul class="rows">${rows}</ul></div>`;
  }).join('') + (days.length > logLimit ? `<button class="btn ghost more" data-act="more">Show older days</button>` : '');
}
function renderSync() {
  const el = $('#sync'); if (!el) return;
  el.textContent = Cloud.status === 'cloud' ? 'Saved on this device and synced to your account.'
    : Cloud.status === 'error' ? 'Cloud sync hit a snag. Your logs are safe on this device.'
    : 'Saved on this device.';
}
function renderAll() {
  renderedDay = todayKey();
  renderHero(); renderCards(); renderLog(); renderSync(); updatePortal();
}
function updatePortal() {
  const now = new Date(), end = new Date(now); end.setHours(23, 59, 59, 999);
  const mins = Math.max(0, Math.round((end - now) / 60000)), h = Math.floor(mins / 60), m = mins % 60;
  $('#portal').textContent = mins < 60 ? `Today's portal closes in ${m} min` : `Today's portal closes in ${h}h ${pad2(m)}m`;
}

/* =====================================================================
   Actions
   ===================================================================== */
function readValue(root, kind) {
  if (kind === 'duration') {
    const h = $('[data-part="h"], #add-h', root).value.trim(), m = $('[data-part="m"], #add-m', root).value.trim();
    if (h === '' && m === '') return { err: 'Enter hours or minutes first.' };
    const hh = Number(h || 0), mm = Number(m || 0);
    if (!Number.isFinite(hh) || !Number.isFinite(mm) || hh < 0 || hh > 23 || mm < 0 || mm > 59) return { err: 'Use 0 to 23 hours and 0 to 59 minutes.' };
    return { v: Math.round(hh) * 60 + Math.round(mm) };
  }
  const tv = $('[data-part="time"], #add-time', root).value;
  if (!tv) return { err: 'Pick a time first.' };
  const [h, m] = tv.split(':').map(Number);
  let v = h * 60 + m; if (kind === 'night' && v < 720) v += 1440;
  return { v };
}
function evFrom(t, e, A) {
  return { type: e.status, task: t, name: t.name, kind: t.kind, value: e.value, oldBest: e.bestBefore, prev: e.prev, prevDate: e.prevDate, streak: A.streak };
}
function commitLog(t, v) {
  const wasPerfect = isPerfect(), tk = todayKey();
  t.logs[tk] = v; touch();
  const A = analyze(t), e = A.entries.find(x => x.date === tk);
  justLogged = t.id; renderAll();
  setTimeout(() => { if (justLogged === t.id) justLogged = null; }, 1800);
  celebrate(evFrom(t, e, A));
  if (!wasPerfect && isPerfect()) celebrate({ type: 'sweep', count: S().tasks.length });
}
function doLog(card) {
  const t = S().tasks.find(x => x.id === card.dataset.tid); if (!t) return;
  const r = readValue(card, t.kind), msg = $('.msg', card);
  if (r.err) { msg.textContent = r.err; const f = $('.fld', card); if (f) f.focus(); return; }
  Sound.unlock();
  editing.delete(t.id);
  Object.keys(drafts).forEach(k => { if (k.indexOf(t.id + ':') === 0) delete drafts[k]; });
  commitLog(t, r.v);
}
function doAdd() {
  const name = $('#add-name').value.trim(), msg = $('#add-msg');
  if (!name) { msg.textContent = 'Give the record a name first.'; $('#add-name').focus(); return; }
  const r = readValue($('#add-val'), addKind);
  if (r.err) { msg.textContent = r.err; return; }
  Sound.unlock();
  const task = { id: 't' + Date.now().toString(36) + Math.floor(Math.random() * 1000), name, kind: addKind, record: r.v, builtin: false, logs: {} };
  S().tasks.push(task); touch();
  addOpen = false; addKind = 'clock';
  renderAll(); renderAdd();
  celebrate({ type: 'added', name, kind: task.kind, value: r.v });
}

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.part && el.dataset.tid) drafts[el.dataset.tid + ':' + el.dataset.part] = el.value;
});
document.addEventListener('change', e => {
  if (e.target.name === 'kind') {
    addKind = e.target.value; $('#kind-hint').textContent = KINDS[addKind].hint; $('#add-val').innerHTML = valueFieldHTML(addKind);
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const el = e.target;
  if (el.closest && el.closest('.bout') && el.classList.contains('fld')) { e.preventDefault(); doLog(el.closest('.bout')); }
  else if (el.closest && el.closest('.add-form') && el.classList.contains('fld')) { e.preventDefault(); doAdd(); }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, card = el.closest('.bout'), tid = card && card.dataset.tid;
  if (act === 'close') { close(); return; }
  switch (act) {
    case 'log': doLog(card); break;
    case 'now': {
      const t = S().tasks.find(x => x.id === tid), inp = $('[data-part="time"]', card), d = new Date();
      if (t && inp) { inp.value = pad2(d.getHours()) + ':' + pad2(d.getMinutes()); drafts[tid + ':time'] = inp.value; }
      break;
    }
    case 'change': editing.add(tid); renderCards(); { const f = $('.bout[data-tid="' + tid + '"] .fld'); if (f) f.focus(); } break;
    case 'cancel-edit': editing.delete(tid); renderCards(); break;
    case 'remove': removing.add(tid); renderCards(); break;
    case 'remove-no': removing.delete(tid); renderCards(); break;
    case 'remove-yes': { const st = S(); st.tasks = st.tasks.filter(t => t.id !== tid); removing.delete(tid); touch(); renderAll(); break; }
    case 'more': logLimit += 14; renderLog(); break;
    case 'sound': Sound.toggle(); renderHero(); break;
    case 'add-toggle': addOpen = !addOpen; renderAdd(); if (addOpen) $('#add-name').focus(); break;
    case 'add-submit': doAdd(); break;
    default: break;
  }
});

/* =====================================================================
   Boot
   ===================================================================== */
renderAll(); renderAdd();
setInterval(() => { updatePortal(); if (todayKey() !== renderedDay && !playing) renderAll(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && todayKey() !== renderedDay && !playing) renderAll(); });
initCloud();
})();
</script>
